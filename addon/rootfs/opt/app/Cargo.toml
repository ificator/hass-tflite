[package]
name = "tflite-server"
version = "0.4.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tract-tflite = "0.22"
sha2 = "0.10"
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
strip = true
